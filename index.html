<style>
  :root {
    --cream: #f6f3ec;
    --dot: #ddd6c6;
    --ink: #1c1c1c;
    --orange: #f4a94e;
    --orange-soft: #ffe7c4;
    --coral: #f27c5b;
    --field: #efefef;
    --muted: #5d5d5d;
    --shadow: 5px 5px 0 var(--ink);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden; user-select: none;
    font-family: "Baloo 2", "Fredoka", "Nunito", "Trebuchet MS", "Segoe UI Rounded", "Segoe UI", system-ui, sans-serif;
    font-weight: 700; }
  body.idle, body.idle * { cursor: none !important; }
  button, select, input { font: inherit; color: var(--ink); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* The player always covers the full area */
  #video { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; object-fit: contain; }
  #video.fill { object-fit: cover; }

  /* Status screen while there is no picture */
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
    background-color: var(--cream); background-image: radial-gradient(var(--dot) 1.3px, transparent 1.4px);
    background-size: 22px 22px; pointer-events: none; }
  #status[hidden] { display: none; }
  .card { width: min(560px, 100%); background: #fff; border: 3px solid var(--ink); border-radius: 18px;
    box-shadow: var(--shadow); overflow: hidden; text-align: center; }
  #status h2 { margin: 0; padding: 18px 20px; background: var(--orange); border-bottom: 3px solid var(--ink);
    font-size: clamp(22px, 3vw, 30px); font-weight: 800; transition: background .2s; }
  #status.warn h2 { background: var(--coral); }
  #status .body { padding: 24px 28px 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #status p { margin: 0; color: #444; font-size: 16px; line-height: 1.5; font-weight: 600; }
  .spinner { width: 32px; height: 32px; border-radius: 50%; border: 4px solid #e4dfd2; border-top-color: var(--ink);
    animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

  /* Warning banner while the picture is running */
  #banner { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); max-width: min(560px, 88vw);
    padding: 5px 14px; background: rgba(244,169,78,.94); color: var(--ink); border: 2px solid var(--ink);
    border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); font-size: 13px; font-weight: 800; text-align: center;
    pointer-events: none; z-index: 5; }
  #banner[hidden] { display: none; }

  /* Controls: small, translucent, only while the mouse moves */
  .ui { transition: opacity .3s, transform .3s; z-index: 4; }
  body.idle .ui { opacity: 0; pointer-events: none; }

  #top { position: fixed; top: 12px; left: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    max-width: 40vw; pointer-events: none; }
  #devName, #devInfo { background: rgba(246,243,236,.85); border: 2px solid var(--ink); border-radius: 9px;
    box-shadow: 2px 2px 0 var(--ink); }
  #devName { padding: 3px 10px; font-size: 13px; font-weight: 800; }
  #devInfo { padding: 3px 9px; font-size: 12px; }
  #devName:empty, #devInfo:empty { display: none; }

  #bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px;
    align-items: center; justify-content: center; max-width: calc(100vw - 24px); padding: 5px 6px;
    background: rgba(246,243,236,.86); border: 2px solid var(--ink);
    border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); }
  body.idle #bar { transform: translate(-50%, 10px); }

  .btn { background: #fff; border: 2px solid var(--ink); border-radius: 9px; padding: 5px 12px; font-size: 13px;
    font-weight: 800; cursor: pointer; box-shadow: 2px 2px 0 var(--ink);
    transition: transform .08s, box-shadow .08s, background .15s; }
  .btn:hover { background: var(--orange-soft); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--orange); }
  .btn.primary:hover { background: #f7b865; }
  .ibtn { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; }
  .ibtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #vol { width: 80px; accent-color: var(--ink); }

  /* Settings: a small popover above the control bar, only as tall as its content */
  #panel { position: fixed; right: 14px; bottom: 64px; width: min(250px, calc(100vw - 28px)); padding: 8px 12px 12px;
    background: rgba(246,243,236,.94); border: 2px solid var(--ink);
    border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); z-index: 6; user-select: text;
    opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(8px);
    transition: opacity .18s, transform .18s, visibility .18s; }
  #panel.open { opacity: 1; visibility: visible; pointer-events: auto; transform: none; }
  body.idle #panel.open { opacity: 1; pointer-events: auto; }
  #panel label { display: block; margin: 9px 0 3px; font-size: 12px; color: var(--muted); font-weight: 800; }
  #panel select { width: 100%; padding: 6px 8px; background: var(--field); border: 2px solid var(--ink);
    border-radius: 8px; font-weight: 800; font-size: 13px; }
  #panel .btn { width: 100%; margin-top: 12px; padding: 5px 10px; }

  #toast { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); padding: 4px 12px;
    background: var(--cream); border: 2px solid var(--ink); border-radius: 9px; box-shadow: 2px 2px 0 var(--ink);
    font-size: 13px; font-weight: 800; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 7; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<video id="video" autoplay playsinline disablepictureinpicture></video>

<div id="status" role="status" aria-live="polite">
  <div class="card">
    <h2 id="sTitle">Starting…</h2>
    <div class="body">
      <div class="spinner" id="spin"></div>
      <p id="sDetail">Looking for your capture card.</p>
    </div>
  </div>
</div>
<div id="banner" hidden role="status"></div>

<div id="top" class="ui"><span id="devName"></span><span id="devInfo"></span></div>

<div id="bar" class="ui">
  <button class="btn ibtn" id="bMute" title="Mute (M)" aria-label="Mute"></button>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
  <button class="btn ibtn" id="bFit" title="Fit or fill (Z)" aria-label="Fit or fill"></button>
  <button class="btn ibtn" id="bSettings" title="Settings (S)" aria-label="Settings"></button>
  <button class="btn ibtn primary" id="bFull" title="Full screen (F)" aria-label="Full screen"></button>
</div>

<aside id="panel" class="ui" aria-label="Settings">
  <label for="vsel">Video input</label>
  <select id="vsel"></select>
  <label for="asel">Audio input</label>
  <select id="asel"></select>
  <label for="rsel">Quality</label>
  <select id="rsel">
    <option value="1920x1080x60">1080p, 60 fps</option>
    <option value="1280x720x60">720p, 60 fps</option>
    <option value="3840x2160x30">4K, 30 fps</option>
    <option value="1920x1080x30">1080p, 30 fps</option>
  </select>
  <label for="dly">Audio delay <span id="dlyVal">0 ms</span></label>
  <input id="dly" type="range" min="0" max="500" step="5" value="0" style="width:100%;accent-color:var(--ink)">
  <button class="btn" id="bAuto" title="Forget saved devices and detect the capture card again">Auto-detect</button>
</aside>
<div id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), panel = $('panel'), banner = $('banner');
  const vsel = $('vsel'), asel = $('asel'), rsel = $('rsel');

  // ---------- Saved preferences ----------
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const prefs = Object.assign(
    { vId: null, vLabel: null, aId: null, aLabel: null, res: '1920x1080x60', vol: 1, delay: 0 },
    store.get('ps5-prefs') || {}
  );
  const savePrefs = () => store.set('ps5-prefs', prefs);
  rsel.value = prefs.res;
  if (rsel.value !== prefs.res) rsel.value = '1920x1080x60';
  $('vol').value = prefs.vol;

  // ---------- State ----------
  const S = {
    stream: null,        // merged video + audio MediaStream
    cur: null,           // { vid, aid } device ids in use
    wasConnected: false, // true once a feed has played in this session
    audioIssue: '',
    needSound: false,
    muted: false,
    audioTrack: null,
    noSignal: false,
    primed: false,
    permDenied: false,
    sig: ''
  };

  // ---------- Device detection ----------
  const CAPTURE = /capture|hdmi|elgato|avermedia|cam ?link|game ?capture|magewell|blackmagic|ugreen|mirabox|genki|ripsaw|hd ?60|hd ?pro|4k ?60|usb ?3(\.0)? ?video|usb ?video|ms21\d\d|video ?capture|macrosilicon/i;
  const WEBCAM = /facetime|integrated|built-?in|webcam|front|rear|infrared|ir camera|obs|virtual|snap camera|camo|droidcam|ivcam|broadcast|manycam|xsplit|internal|surface/i;
  const scoreDevice = label => (CAPTURE.test(label) ? 3 : 0) - (WEBCAM.test(label) ? 3 : 0);
  const findSaved = (list, id, label) =>
    list.find(d => id && d.deviceId === id) || list.find(d => label && d.label === label);

  function pickVideo(list) {
    if (prefs.vId || prefs.vLabel) {
      const d = findSaved(list, prefs.vId, prefs.vLabel);
      return d ? { device: d, state: 'ok' } : { device: null, state: 'missing' };
    }
    const scored = list.map(d => ({ d, s: scoreDevice(d.label) })).sort((a, b) => b.s - a.s);
    const best = scored[0];
    if (best && (best.s > 0 || (best.s === 0 && scored.filter(x => x.s >= 0).length === 1))) {
      return { device: best.d, state: 'ok' };
    }
    return { device: null, state: 'none' };
  }

  function pickAudio(list, vDev) {
    const usable = list.filter(d => d.deviceId !== 'default' && d.deviceId !== 'communications');
    if (prefs.aId || prefs.aLabel) {
      const d = findSaved(usable, prefs.aId, prefs.aLabel);
      return d ? { device: d, state: 'ok' } : { device: null, state: 'missing' };
    }
    // Capture cards usually expose audio under the same hardware group as their video.
    let d = vDev && usable.find(x => x.groupId && x.groupId === vDev.groupId);
    if (!d) {
      const c = usable.map(x => ({ x, s: scoreDevice(x.label) })).filter(o => o.s > 0).sort((a, b) => b.s - a.s)[0];
      d = c && c.x;
    }
    return d ? { device: d, state: 'ok' } : { device: null, state: 'none' };
  }

  async function getDevices() {
    let devs = await navigator.mediaDevices.enumerateDevices();
    const needLabels = devs.some(d => (d.kind === 'videoinput' || d.kind === 'audioinput') && !d.label);
    if (needLabels && !S.primed) {
      // Device names are hidden until the page has permission.
      try {
        const t = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        t.getTracks().forEach(x => x.stop());
      } catch {
        try {
          const t = await navigator.mediaDevices.getUserMedia({ video: true });
          t.getTracks().forEach(x => x.stop());
        } catch (e) {
          if (e.name === 'NotAllowedError' || e.name === 'SecurityError') { S.permDenied = true; return null; }
        }
      }
      devs = await navigator.mediaDevices.enumerateDevices();
    }
    S.primed = true;
    S.permDenied = false;
    return devs;
  }

  // ---------- Status UI ----------
  function setStatus(kind, title, detail) {
    const el = $('status');
    el.hidden = false;
    el.classList.toggle('warn', kind === 'warn');
    $('spin').style.display = kind === 'wait' ? '' : 'none';
    $('sTitle').textContent = title;
    $('sDetail').textContent = detail || '';
  }
  const clearStatus = () => { $('status').hidden = true; };

  function updateBanner() {
    const parts = [];
    if (S.noSignal) parts.push('No video signal. Check that the PS5 is on and the HDMI cable is connected.');
    if (S.audioIssue) parts.push(S.audioIssue);
    if (S.needSound) parts.push('Click anywhere to turn on sound.');
    banner.textContent = parts.join('  ');
    banner.hidden = !parts.length;
  }

  // ---------- Connecting ----------
  function stopStream() {
    if (S.stream) S.stream.getTracks().forEach(t => t.stop());
    S.stream = null; S.cur = null; S.audioTrack = null;
    detachAudio(); stopWatchdog();
    video.srcObject = null;
    $('devName').textContent = ''; $('devInfo').textContent = '';
  }

  function onLost(track) {
    if (!S.stream) return;
    const what = track.kind === 'video' ? 'Capture card' : 'Audio input';
    stopStream();
    setStatus('warn', `${what} disconnected`, 'Reconnecting automatically as soon as it is available again.');
    S.audioIssue = ''; updateBanner();
    tick();
  }

  async function playVideo() {
    video.muted = true; // sound is played through Web Audio so it can be delayed to match the picture
    try { await video.play(); } catch {}
    attachAudio();
    syncMuteLabel();
  }

  async function connect() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('warn', 'Capture is not supported', 'Open this file in a recent version of Chrome, Edge or Firefox.');
      return;
    }
    if (S.stream && S.stream.getTracks().some(t => t.readyState === 'ended')) {
      onLost(S.stream.getTracks().find(t => t.readyState === 'ended'));
      return;
    }

    const devs = await getDevices();
    if (!devs) {
      if (!S.stream) setStatus('warn', 'Camera access is blocked',
        'Allow camera and microphone for this page (see the address bar). It will retry automatically.');
      return;
    }
    const vList = devs.filter(d => d.kind === 'videoinput');
    const aList = devs.filter(d => d.kind === 'audioinput');
    refreshPanel(vList, aList);

    const v = pickVideo(vList);
    if (v.state !== 'ok') {
      if (S.stream) { stopStream(); }
      if (v.state === 'missing') {
        const name = prefs.vLabel || 'The saved capture card';
        setStatus('warn',
          S.wasConnected ? 'Capture card disconnected' : 'Selected capture card is not available',
          S.wasConnected
            ? `Reconnecting automatically when "${name}" is available again.`
            : `"${name}" is not connected. Waiting for it, and it will connect automatically.`);
      } else {
        setStatus('wait', 'No capture card detected',
          'Plug in your capture card, or move the mouse and open Settings to pick a video input.');
      }
      return;
    }

    const a = pickAudio(aList, v.device);
    S.audioIssue = a.state === 'missing'
      ? `Saved audio input "${prefs.aLabel || 'unknown'}" is not available. Playing without sound until it returns.`
      : a.state === 'none'
        ? 'No audio input found for the capture card. Choose one in Settings.'
        : '';

    const wantAid = a.device ? a.device.deviceId : null;
    const running = S.stream && S.cur && S.cur.vid === v.device.deviceId && S.cur.aid === wantAid;
    if (running) { updateBanner(); return; }

    // (Re)connect
    stopStream();
    setStatus('wait', 'Connecting…', v.device.label || 'Capture card');
    const [w, h, fps] = prefs.res.split('x').map(Number);
    let vStream;
    try {
      vStream = await navigator.mediaDevices.getUserMedia({
        video: { deviceId: { exact: v.device.deviceId }, width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: fps }, resizeMode: { ideal: 'none' } },
        audio: false
      });
    } catch (e) {
      setStatus('warn', 'Could not open the capture card',
        'It may be in use by another app or tab. Retrying automatically.');
      return;
    }
    let aTrack = null;
    if (a.device) {
      try {
        const aStream = await navigator.mediaDevices.getUserMedia({
          video: false,
          audio: { deviceId: { exact: a.device.deviceId }, echoCancellation: false, noiseSuppression: false,
                   autoGainControl: false, channelCount: { ideal: 2 }, sampleRate: { ideal: 48000 }, latency: { ideal: 0 } }
        });
        aTrack = aStream.getAudioTracks()[0];
      } catch {
        S.audioIssue = 'The audio input could not be opened. Playing without sound, retrying automatically.';
      }
    }

    // Merge video and audio into one stream
    try {
      const tracks = [...vStream.getVideoTracks(), ...(aTrack ? [aTrack] : [])];
      S.stream = new MediaStream(tracks); // one merged capture session
      S.audioTrack = aTrack;
      S.cur = { vid: v.device.deviceId, aid: aTrack ? wantAid : null };
      tracks.forEach(t => t.addEventListener('ended', () => onLost(t)));
      video.srcObject = new MediaStream(vStream.getVideoTracks()); // picture shown with no extra buffering
      await playVideo();
      startWatchdog();
    } catch (e) {
      vStream.getTracks().forEach(t => t.stop()); if (aTrack) aTrack.stop();
      S.stream = null; S.cur = null; S.audioTrack = null;
      throw e;
    }

    prefs.vId = v.device.deviceId; prefs.vLabel = v.device.label;
    if (a.device && aTrack) { prefs.aId = a.device.deviceId; prefs.aLabel = a.device.label; }
    savePrefs();

    const st = vStream.getVideoTracks()[0].getSettings();
    $('devName').textContent = v.device.label || 'Capture card';
    $('devInfo').textContent = st.width ? `${st.width}×${st.height} · ${Math.round(st.frameRate || 0)} fps` : '';
    S.wasConnected = true;
    clearStatus();
    updateBanner();
    refreshPanel(vList, aList, true);
  }

  // Serialised retry loop: runs every 2 seconds and whenever devices change
  let busy = false, again = false;
  async function tick() {
    if (busy) { again = true; return; }
    busy = true;
    try { await connect(); } catch (e) { console.error(e); }
    busy = false;
    if (again) { again = false; tick(); }
  }
  setInterval(tick, 2000);
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener('devicechange', tick);
  }

  // ---------- Settings panel ----------
  function fillSelect(sel, list, savedId, savedLabel, currentId, placeholder) {
    sel.innerHTML = '';
    const usable = list.filter(d => d.deviceId !== 'default' && d.deviceId !== 'communications');
    const hasSaved = (savedId || savedLabel) && findSaved(usable, savedId, savedLabel);
    if ((savedId || savedLabel) && !hasSaved) {
      const o = new Option(`${savedLabel || 'Saved device'} (not available)`, savedId || savedLabel);
      sel.add(o);
    }
    if (!usable.length && !sel.options.length) sel.add(new Option(placeholder, ''));
    usable.forEach((d, i) => sel.add(new Option(d.label || `Device ${i + 1}`, d.deviceId)));
    const want = currentId || (hasSaved && hasSaved.deviceId) || savedId;
    if (want && [...sel.options].some(o => o.value === want)) sel.value = want;
  }

  function refreshPanel(vList, aList, force) {
    const sig = [...vList, ...aList].map(d => d.deviceId + d.label).join('|') + '#' + (S.cur ? S.cur.vid + S.cur.aid : '');
    if (!force && sig === S.sig) return;
    if (document.activeElement === vsel || document.activeElement === asel) return;
    S.sig = sig;
    fillSelect(vsel, vList, prefs.vId, prefs.vLabel, S.cur && S.cur.vid, 'No video inputs found');
    fillSelect(asel, aList, prefs.aId, prefs.aLabel, S.cur && S.cur.aid, 'No audio inputs found');
  }

  function reconnectNow() {
    S.wasConnected = false; S.sig = '';
    stopStream();
    setStatus('wait', 'Connecting…', '');
    tick();
  }

  const labelOf = sel => {
    const t = sel.selectedOptions[0] ? sel.selectedOptions[0].textContent : null;
    return t ? t.replace(/ \(not available\)$/, '') : null;
  };
  vsel.onchange = () => { prefs.vId = vsel.value || null; prefs.vLabel = labelOf(vsel); savePrefs(); reconnectNow(); };
  asel.onchange = () => { prefs.aId = asel.value || null; prefs.aLabel = labelOf(asel); savePrefs(); reconnectNow(); };
  rsel.onchange = () => { prefs.res = rsel.value; savePrefs(); reconnectNow(); };
  $('bAuto').onclick = () => {
    prefs.vId = prefs.vLabel = prefs.aId = prefs.aLabel = null; savePrefs();
    toast('Detecting capture card…'); reconnectNow();
  };

  let panelOpen = false;
  function setPanel(open) {
    panelOpen = open; panel.classList.toggle('open', open);
    wake();
  }
  $('bSettings').onclick = () => setPanel(!panelOpen);

  // ---------- Fullscreen: double-click or double-tap ----------
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => toast('Full screen was blocked'));
  }
  let lastTap = 0, lastX = 0, lastY = 0;
  document.addEventListener('pointerup', e => {
    if (e.target.closest('#bar, #panel')) return;
    const now = performance.now();
    if (now - lastTap < 350 && Math.hypot(e.clientX - lastX, e.clientY - lastY) < 40) {
      lastTap = 0; toggleFullscreen();
    } else { lastTap = now; lastX = e.clientX; lastY = e.clientY; }
  });
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('fullscreenchange', () => {
    $('bFull').innerHTML = document.fullscreenElement ? ICON.exit : ICON.enter;
  });

  // First click unlocks sound if the browser blocked it
  document.addEventListener('pointerdown', e => {
    if (panelOpen && !e.target.closest('#panel, #bSettings')) setPanel(false);
    unlockAudio();
  }, true);

  // ---------- Auto-hide controls and cursor ----------
  let idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      const hovering = $('bar').matches(':hover') || panel.matches(':hover');
      if (panelOpen || hovering) wake();
      else document.body.classList.add('idle');
    }, 2000);
  }
  ['mousemove', 'pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, wake, { passive: true }));
  wake();

  // ---------- Misc controls ----------
  function toast(t) {
    const el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1600);
  }
  function syncMuteLabel() { $('bMute').innerHTML = S.muted ? ICON.muted : ICON.sound; $('bMute').title = S.muted ? 'Unmute (M)' : 'Mute (M)'; }
  function toggleMute() { unlockAudio(); S.muted = !S.muted; applyVolume(); syncMuteLabel(); }
  function toggleFit() {
    video.classList.toggle('fill');
    const f = video.classList.contains('fill');
    $('bFit').innerHTML = f ? ICON.fill : ICON.fit;
    toast(f ? 'Fill (crops the edges)' : 'Fit (shows the full picture)');
  }
  $('bMute').onclick = toggleMute;
  $('bFit').onclick = toggleFit;
  $('bFull').onclick = toggleFullscreen;
  $('vol').oninput = e => {
    prefs.vol = +e.target.value; savePrefs();
    if (S.muted && prefs.vol > 0) { S.muted = false; syncMuteLabel(); }
    applyVolume();
  };
  document.addEventListener('keydown', e => {
    if (/SELECT|INPUT/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'f') toggleFullscreen();
    else if (k === 'm') toggleMute();
    else if (k === 'z') toggleFit();
    else if (k === '[' || k === ']') { setDelay(prefs.delay + (k === ']' ? 10 : -10)); toast('Audio delay ' + prefs.delay + ' ms'); }
    else if (k === 's') setPanel(!panelOpen);
    else if (k === 'escape') setPanel(false);
  });

  // ---------- Audio via Web Audio: one path for volume and lip-sync delay ----------
  const A = { ctx: null, gain: null, delay: null, src: null };
  function ensureAudio() {
    if (A.ctx) return A.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    A.ctx = new AC({ latencyHint: 'interactive' });
    A.delay = A.ctx.createDelay(1);
    A.gain = A.ctx.createGain();
    A.delay.connect(A.gain); A.gain.connect(A.ctx.destination);
    A.ctx.onstatechange = () => { S.needSound = !!S.audioTrack && A.ctx.state !== 'running'; updateBanner(); };
    applyVolume(); applyDelay();
    return A.ctx;
  }
  function applyVolume() { if (A.gain) A.gain.gain.setTargetAtTime(S.muted ? 0 : prefs.vol, A.ctx.currentTime, 0.015); }
  function applyDelay() { if (A.delay) A.delay.delayTime.setTargetAtTime(prefs.delay / 1000, A.ctx.currentTime, 0.02); }
  function attachAudio() {
    detachAudio();
    if (!S.audioTrack) { S.needSound = false; updateBanner(); return; }
    const ctx = ensureAudio();
    A.src = ctx.createMediaStreamSource(new MediaStream([S.audioTrack]));
    A.src.connect(A.delay);
    ctx.resume().catch(() => {});
    S.needSound = ctx.state !== 'running'; updateBanner();
  }
  function detachAudio() { if (A.src) { try { A.src.disconnect(); } catch {} A.src = null; } }
  function unlockAudio() { if (A.ctx && A.ctx.state !== 'running') A.ctx.resume().catch(() => {}); }
  document.addEventListener('keydown', unlockAudio, true);
  function setDelay(ms) {
    prefs.delay = Math.max(0, Math.min(500, Math.round(ms))); savePrefs(); applyDelay();
    $('dly').value = prefs.delay; $('dlyVal').textContent = prefs.delay + ' ms';
  }
  $('dly').oninput = e => setDelay(+e.target.value);

  // ---------- Frame watchdog: warns when the card stops delivering pictures ----------
  let lastFrame = 0, wdTimer = null, rvfcId = 0;
  function startWatchdog() {
    stopWatchdog();
    if (!video.requestVideoFrameCallback) return;
    lastFrame = performance.now();
    const loop = () => { lastFrame = performance.now(); rvfcId = video.requestVideoFrameCallback(loop); };
    rvfcId = video.requestVideoFrameCallback(loop);
    wdTimer = setInterval(() => {
      const dead = !document.hidden && performance.now() - lastFrame > 4000;
      if (dead !== S.noSignal) { S.noSignal = dead; updateBanner(); }
    }, 1000);
  }
  function stopWatchdog() {
    clearInterval(wdTimer);
    if (rvfcId && video.cancelVideoFrameCallback) video.cancelVideoFrameCallback(rvfcId);
    rvfcId = 0; S.noSignal = false;
  }
  document.addEventListener('visibilitychange', () => { lastFrame = performance.now(); });

  // Release keyboard focus after using a control so shortcuts keep working
  [vsel, asel, rsel, $('vol'), $('dly')].forEach(el => el.addEventListener('change', () => el.blur()));
  setDelay(prefs.delay);

  const svg = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const ICON = {
    sound: svg('<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'),
    muted: svg('<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'),
    fit: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><rect x="7" y="9" width="10" height="6" rx="1"/>'),
    fill: svg('<rect x="3" y="5" width="18" height="14" rx="2" fill="currentColor"/>'),
    settings: svg('<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/>'),
    enter: svg('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'),
    exit: svg('<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>')
  };
  syncMuteLabel();
  $('bFit').innerHTML = ICON.fit;
  $('bSettings').innerHTML = ICON.settings;
  $('bFull').innerHTML = ICON.enter;

  tick();
})();
</script>
</body>
</html>
